<!DOCTYPE html>
<html lang="id">
<head>
<script src="../assets/config.js?v=4"></script>
<script src="../assets/gas-bridge.js?v=4" data-app="skk"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Sebaran Lokasi SKK Migas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ink: #14232e; --muted: #5d6b76; --line: #d9e0e5; --panel: #f6f8f9;
    --green: #14a35c; --blue: #2d6cdf; --red: #d9363e; --navy: #12304a; --focus: #0b5fff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
         color: var(--ink); display: flex; background: #fff; }

  #panel { width: 340px; flex: none; display: flex; flex-direction: column; background: var(--panel);
           border-right: 1px solid var(--line); z-index: 1000; }
  #head { padding: 16px 16px 12px; }
  #head h1 { font-size: 17px; line-height: 1.25; margin: 0 0 2px; font-weight: 650; }
  #head p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .block { padding: 0 16px 10px; }
  .block > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input[type=search], select { width: 100%; height: 38px; padding: 0 10px; font: inherit; font-size: 14px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  input[type=search]:focus, select:focus, .chip:focus-visible, .item:focus-visible, button:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 1px; }

  #statusline { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 8px; font-size: 12.5px; color: var(--muted); }
  #reset { font: inherit; font-size: 12.5px; color: var(--focus); background: none; border: 0; cursor: pointer; padding: 2px 4px; }
  #list { flex: 1; overflow-y: auto; border-top: 1px solid var(--line); background: #fff; }
  .item { display: block; width: 100%; text-align: left; font: inherit; background: #fff; border: 0;
          border-bottom: 1px solid #edf1f3; padding: 9px 16px 9px 14px; cursor: pointer; border-left: 4px solid var(--c); }
  .item:hover { background: #f1f5f8; }
  .item b { display: block; font-size: 13.5px; font-weight: 600; }
  .item span { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  #empty { padding: 20px 16px; font-size: 13.5px; color: var(--muted); display: none; }
  #skipped { padding: 10px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--panel); display: none; line-height: 1.45; }
  #skipped p { margin: 0 0 4px; }

  #mapwrap { position: relative; flex: 1; min-width: 0; height: 100%; }
  #map { position: absolute; inset: 0; background: #cfe3ee; }

  /* kolom kanan: status (atas) + rekap (bawah), lebar sama, tidak saling menimpa */
  #rightcol { position: absolute; top: 12px; right: 12px; bottom: 64px; z-index: 1000; width: 300px; max-width: calc(100% - 24px);
    display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  #rightcol > * { pointer-events: auto; }
  #statusbox { flex: none; background: rgba(255,255,255,.97); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px; box-shadow: 0 6px 18px rgba(15,35,50,.22); }
  #statusbox .lbl { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 2px 7px; }
  #chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .chip { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "dot lbl" "n n"; align-items: center; gap: 3px 5px;
    width: 100%; padding: 6px 8px; font: inherit; font-size: 11.5px; text-align: left; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; transition: background .15s, box-shadow .15s; }
  .chip .dot { grid-area: dot; width: 9px; height: 9px; border-radius: 50%; background: var(--c); border: 2px solid var(--c); box-sizing: content-box; }
  .chip > span:nth-child(2) { grid-area: lbl; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip .n { grid-area: n; font-size: 18px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .chip[aria-pressed=false] { background: transparent; color: var(--muted); }
  .chip[aria-pressed=false] .n { color: var(--muted); font-weight: 500; }
  .chip[aria-pressed=false] .dot { background: transparent; }
  .chip[aria-pressed=true] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
  .tg { display: flex; align-items: center; gap: 7px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line);
        font-size: 12.5px; cursor: pointer; user-select: none; }
  .tg input { margin: 0; width: 15px; height: 15px; accent-color: var(--navy); }

  /* legenda */
  #legend { position: absolute; left: 12px; bottom: 26px; z-index: 900; background: rgba(255,255,255,.96); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; box-shadow: 0 2px 8px rgba(15,35,50,.16); font-size: 12px; }
  #legend div { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  #legend svg { flex: none; }

  /* rekap Top UPT: pill ringkas yang bisa dibuka jadi kartu */
  #rekap { flex: 0 1 auto; min-height: 0; margin-top: auto; display: none; flex-direction: column;
    background: rgba(255,255,255,.97); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(15,35,50,.22); font-size: 12.5px; }
  #rekap .rk-pill { flex: none; display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; font: inherit; color: var(--ink);
    background: none; border: 0; cursor: pointer; text-align: left; }
  #rekap .rk-ico { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--navy); display: flex; align-items: center; justify-content: center; }
  #rekap .rk-t { flex: 1; min-width: 0; line-height: 1.25; }
  #rekap .rk-t b { display: block; font-size: 13px; }
  #rekap .rk-t span { display: block; font-size: 11.5px; color: var(--muted); }
  #rekap .rk-arrow { flex: none; color: var(--muted); transition: transform .2s ease; }
  #rekap.open .rk-arrow { transform: rotate(180deg); }
  #rekap .rk-body { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
  #rekap.open .rk-body { display: flex; }
  #rekap .rk-seg { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; margin-bottom: 8px; background: #eef2f5; border-radius: 9px; }
  #rekap .rk-seg button { font: inherit; font-size: 12px; padding: 5px 0; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; }
  #rekap .rk-seg button[aria-pressed=true] { background: #fff; color: var(--navy); font-weight: 650; box-shadow: 0 1px 3px rgba(15,35,50,.18); }
  #rekap .rk-list { flex: 1 1 auto; min-height: 0; max-height: 340px; overflow-y: auto; }
  #rekap .rk-row { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; margin: 0 0 4px; padding: 0 8px 0 6px;
    font: inherit; color: var(--ink); text-align: left; background: #f3f6f8; border: 0; border-radius: 8px; overflow: hidden; cursor: pointer; }
  #rekap .rk-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--c); opacity: .22; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  #rekap .rk-row:hover .rk-fill { opacity: .38; }
  #rekap .rk-row.sel { box-shadow: inset 0 0 0 2px #f5b301; }
  #rekap .rk-rank { position: relative; flex: none; width: 18px; height: 18px; border-radius: 50%; background: #8b95a1; color: #fff;
    font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  #rekap .rk-row.top .rk-rank { background: var(--navy); }
  #rekap .rk-nm { position: relative; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rekap .rk-v { position: relative; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
  #rekap .rk-s { position: relative; flex: none; min-width: 36px; display: flex; align-items: center; justify-content: flex-end; gap: 3px;
    font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #rekap .rk-foot { flex: none; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
  #rekap .rk-empty { padding: 10px 4px; color: var(--muted); }

  /* penanda */
  .pin { background: none; border: 0; }
  .pin svg { display: block; overflow: visible; transform-origin: 50% 93%; transition: transform .14s ease;
             filter: drop-shadow(0 2px 2.5px rgba(10,25,40,.35)); }
  .pin:hover svg { transform: scale(1.14); }
  .pin.dot svg { transform-origin: 50% 50%; filter: drop-shadow(0 1px 2px rgba(10,25,40,.4)); }
  .pin.dot:hover svg { transform: scale(1.2); }
  .pin.sel svg { transform: scale(1.22); filter: drop-shadow(0 0 0 #f5b301) drop-shadow(0 0 5px rgba(245,179,1,.95)) drop-shadow(0 2px 2.5px rgba(10,25,40,.4)); }

  /* popup */
  .leaflet-popup-content-wrapper { border-radius: 12px; }
  .leaflet-popup-content { margin: 14px 16px; font-family: inherit; }
  .pp { min-width: 240px; max-width: 300px; }
  .pp h3 { margin: 0 0 6px; font-size: 15px; line-height: 1.3; }
  .pp .badge { display: inline-block; font-size: 11.5px; font-weight: 600; color: #fff; background: var(--c); border-radius: 10px; padding: 2px 9px; margin-bottom: 9px; }
  .pp dl { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 5px 8px; font-size: 13px; }
  .pp dt { color: var(--muted); }
  .pp dd { margin: 0; word-break: break-word; }
  .pp .big { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 8px; }
  .pp .big b { font-size: 28px; line-height: 1; color: var(--c); }
  .pp .big span { font-size: 13px; color: var(--muted); }
  .pp .mini { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; margin-bottom: 10px; }
  .pp .mini i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .pp .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 10px; }
  .pp .types div { background: #f1f5f8; border-radius: 8px; padding: 7px 4px; text-align: center; }
  .pp .types b { display: block; font-size: 18px; line-height: 1.1; color: var(--navy); }
  .pp .types span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pp .act { margin-top: 10px; width: 100%; font: inherit; font-size: 13px; font-weight: 600; padding: 7px 10px; border-radius: 7px; cursor: pointer;
             border: 1px solid var(--navy); color: var(--navy); background: #fff; }
  .pp .act:hover { background: var(--navy); color: #fff; }
  .pp .nodata { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  #loading { position: absolute; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
             background: rgba(255,255,255,.85); font-size: 14px; color: var(--muted); }
  #loading.err { color: var(--red); padding: 24px; text-align: center; }

  @media (max-width: 760px) {
    body { flex-direction: column-reverse; }
    #panel { width: 100%; height: 50vh; border-right: 0; border-top: 1px solid var(--line); }
    #head { padding: 10px 14px 6px; } #head p { display: none; }
    .block { padding: 0 14px 7px; }
    #mapwrap { height: 50vh; flex: none; }
    #rightcol { top: 8px; right: 8px; bottom: 58px; width: 280px; }
    #legend { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<aside id="panel" aria-label="Filter lokasi">
  <div id="head">
    <h1>Sebaran Lokasi SKK Migas</h1>
    <p>Klik pin UPT untuk melihat wilayah layanannya, atau klik pin lokasi untuk detail.</p>
  </div>
  <div class="block">
    <label for="q">Cari</label>
    <input id="q" type="search" placeholder="Nama, koordinat, type, UPT, penanggung jawab..." autocomplete="off">
  </div>
  <div class="block">
    <label for="upt">UPT / Penanggung jawab</label>
    <select id="upt"><option value="">Semua UPT</option></select>
  </div>
  <div class="block">
    <label for="type">Type</label>
    <select id="type"><option value="">Semua type</option></select>
  </div>
  <div id="statusline">
    <span id="count">Memuat data...</span>
    <button id="reset" type="button">Reset filter</button>
  </div>
  <div id="list" role="list"></div>
  <div id="empty">Tidak ada lokasi yang cocok. Coba kata kunci lain atau aktifkan status lain.</div>
  <div id="skipped"></div>
</aside>

<div id="mapwrap">
  <div id="map"></div>
  <div id="rightcol">
    <div id="statusbox">
      <span class="lbl" id="lblStatus">Status</span>
      <div id="chips" role="group" aria-labelledby="lblStatus"></div>
      <label class="tg"><input type="checkbox" id="tgUpt" checked> Tampilkan pin UPT</label>
    </div>

    <!-- Rekap Top UPT -->
    <div id="rekap" aria-label="Rekap layanan per UPT">
      <button type="button" class="rk-pill" id="rkPill" aria-expanded="false">
        <span class="rk-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="3" width="4" height="18" rx="1"/><rect x="17" y="8" width="4" height="13" rx="1"/></svg></span>
        <span class="rk-t"><b id="rkTitle">Top UPT</b><span id="rkSub">-</span></span>
        <svg class="rk-arrow" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="rk-body">
        <div class="rk-seg" role="group" aria-label="Urutkan berdasarkan">
          <button type="button" data-m="layanan" aria-pressed="true">Jumlah layanan</button>
          <button type="button" data-m="forecaster" aria-pressed="false">Jumlah forecaster</button>
        </div>
        <div class="rk-list" id="rkList"></div>
        <div class="rk-foot" id="rkFoot"></div>
      </div>
    </div>
  </div>
  <div id="legend" aria-label="Legenda"></div>

  <div id="loading">Memuat data lokasi...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  'use strict';

  var STATUS = {
    ongoing:   { label: 'On Going',   color: '#14a35c' },
    request:   { label: 'By Request', color: '#2d6cdf' },
    suspended: { label: 'Suspended',  color: '#d9363e' },
    lainnya:   { label: 'Lainnya',    color: '#6b7280' }
  };
  var STATUS_ORDER = ['ongoing', 'request', 'suspended'];
  var Z = { ongoing: 200, request: 100, suspended: 0 };
  var UPT_COLOR = '#12304a', PUSAT_COLOR = '#6d3fc0', EMPTY_COLOR = '#8b95a1';
  function uptColor(u) {
    if (stats[u.id] && stats[u.id].total === 0) return EMPTY_COLOR;   // tidak ada lokasi SKK
    return u.kind === 'pusat' ? PUSAT_COLOR : UPT_COLOR;
  }

  var GLYPH = {
    offshore: 'M17 15l1.55 1.55c-.96 1.69-3.33 3.04-5.55 3.37V11h3V9h-3V7.82C14.16 7.4 15 6.3 15 5c0-1.65-1.35-3-3-3S9 3.35 9 5c0 1.3.84 2.4 2 2.82V9H8v2h3v8.92c-2.22-.33-4.59-1.68-5.55-3.37L7 15l-4-3v3c0 3.31 4.03 6 9 6s9-2.69 9-6v-3l-4 3zM12 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z',
    onshore:  'M3 21V10l6 3V10l6 3V4h3v17H3z',
    outlook:  'M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm-2 8h14v10H5V10z',
    other:    'M12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12z',
    pusat:    'M4 21V4h10v6h6v11H4zM7 7v2h2V7H7zm0 4v2h2v-2H7zm0 4v2h2v-2H7zm8-1v2h2v-2h-2z'
  };
  function pm(d) { return '<path d="' + d + '"/>'; }
  // menara antena/stasiun: tiang, titik pemancar, dan gelombang sinyal
  var UPT_MARK =
    '<circle cx="12" cy="7" r="1.900"/>' +
    '<path d="M12 9.200L15.300 21.500H13.400L12 16.200L10.600 21.500H8.700Z"/>' +
    '<rect x="9.700" y="16.600" width="4.600" height="1.300"/>' +
    '<path d="M9.700 4.800a3.500 3.500 0 0 0 0 4.400M14.300 4.800a3.500 3.500 0 0 1 0 4.400M7.400 2.900a6.600 6.600 0 0 0 0 8.200M16.600 2.900a6.600 6.600 0 0 1 0 8.200" fill="none" stroke="#fff" stroke-width="1.600" stroke-linecap="round"/>';
  function glyphKey(type) {
    var t = String(type || '').toLowerCase();
    if (t.indexOf('off') === 0) return 'offshore';
    if (t.indexOf('on') === 0) return 'onshore';
    if (t.indexOf('outlo') >= 0 || t.indexOf('14') >= 0) return 'outlook';
    return 'other';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- ikon ----------
  var SHADOW = '<ellipse cx="17" cy="41.600" rx="6" ry="2" fill="rgba(0,0,0,.22)"/>';
  function locIcon(it) {
    var c = (STATUS[it.status] || STATUS.lainnya).color;
    var svg = '<svg width="26" height="26" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="13" cy="13" r="11" fill="' + c + '" stroke="#fff" stroke-width="2.400"/>' +
      '<circle cx="13" cy="13" r="8.200" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>' +
      '<g transform="translate(6.800 6.800) scale(0.510)" fill="#fff" fill-rule="evenodd">' + pm(GLYPH[glyphKey(it.type)]) + '</g></svg>';
    return L.divIcon({ className: 'pin dot', html: svg, iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -13] });
  }
  function uptIcon(u, selected) {
    var c = uptColor(u);
    var svg = '<svg width="30" height="39" viewBox="0 0 34 44" xmlns="http://www.w3.org/2000/svg">' + SHADOW +
      '<path d="M11.500 29.500L17 40L22.500 29.500Z" fill="' + c + '" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
      '<rect x="4" y="3" width="26" height="27" rx="7" fill="' + c + '" stroke="#fff" stroke-width="2.200"/>' +
      '<rect x="12" y="28" width="10" height="3.500" fill="' + c + '"/>' +
      '<g transform="translate(10.400 9.900) scale(0.55)" fill="#fff" fill-rule="evenodd">' + (u.kind === 'pusat' ? pm(GLYPH.pusat) : UPT_MARK) + '</g></svg>';
    return L.divIcon({ className: 'pin' + (selected ? ' sel' : ''), html: svg, iconSize: [30, 39], iconAnchor: [15, 36], popupAnchor: [0, -32] });
  }
  function legendIcon(mark, color, round) {
    return '<svg width="20" height="20" viewBox="0 0 20 20"><' + (round ? 'circle cx="10" cy="10" r="10"' : 'rect width="20" height="20" rx="5"') + ' fill="' + color + '"/>' +
      '<g transform="translate(3 3) scale(0.58)" fill="#fff" fill-rule="evenodd">' + mark + '</g></svg>';
  }
  document.getElementById('legend').innerHTML =
    '<div>' + legendIcon(pm(GLYPH.offshore), '#5d6b76', true) + 'Off Shore</div>' +
    '<div>' + legendIcon(pm(GLYPH.onshore), '#5d6b76', true) + 'On Shore</div>' +
    '<div>' + legendIcon(pm(GLYPH.outlook), '#5d6b76', true) + 'Outlook 14 hari</div>' +
    '<div>' + legendIcon(UPT_MARK, UPT_COLOR, false) + 'UPT </div>' +
    '<div>' + legendIcon(pm(GLYPH.pusat), PUSAT_COLOR, false) + 'Kantor pusat</div>';

  // ---------- peta ----------
  var INDONESIA = L.latLngBounds([-11.5, 94.5], [6.5, 141.5]);
  var map = L.map('map', { minZoom: 4, maxZoom: 18, maxBounds: L.latLngBounds([-18, 88], [13, 150]), maxBoundsViscosity: 0.8 });
  map.fitBounds(INDONESIA);
  var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' });
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles &copy; Esri' });
  osm.addTo(map);
  L.control.layers({ 'Peta': osm, 'Satelit': sat }, null, { position: 'bottomright' }).addTo(map);

  var lineLayer = L.layerGroup().addTo(map);
  var locLayer = L.layerGroup().addTo(map);
  var uptLayer = L.layerGroup().addTo(map);

  // ---------- state ----------
  var ALL = [], UPTS = [], uptById = {}, stats = {};
  var markers = {}, uptMarkers = {};
  var active = { ongoing: true, request: true, suspended: true };
  var selUpt = '';

  var $q = document.getElementById('q'), $type = document.getElementById('type'), $upt = document.getElementById('upt');
  var $chips = document.getElementById('chips'), $list = document.getElementById('list');
  var $count = document.getElementById('count'), $empty = document.getElementById('empty');
  var $rekap = document.getElementById('rekap');

  function uptName(it) { return it.upt && uptById[it.upt] ? uptById[it.upt].nama : ''; }
  function haystack(it) {
    return [it.lokasi, it.headerCms, it.lat + ',' + it.lng, it.type, (STATUS[it.status] || STATUS.lainnya).label, it.pj, uptName(it)].join(' | ').toLowerCase();
  }
  function allActive() { return STATUS_ORDER.every(function (k) { return active[k]; }); }

  // ---------- popup ----------
  function locPopup(it) {
    var st = STATUS[it.status] || STATUS.lainnya;
    return '<div class="pp" style="--c:' + st.color + '">' +
      '<h3>' + esc(it.lokasi) + '</h3><span class="badge">' + esc(st.label) + '</span>' +
      '<dl><dt>Lokasi</dt><dd>' + esc(it.headerCms || it.lokasi) + '</dd>' +
      '<dt>Koordinat</dt><dd>' + it.lat.toFixed(5) + ', ' + it.lng.toFixed(5) + '</dd>' +
      '<dt>Type</dt><dd>' + esc(it.type || '-') + '</dd>' +
      '<dt>Penanggung jawab</dt><dd>' + esc(it.pj || '-') + '</dd></dl>' +
      (it.upt ? '<button type="button" class="act" data-upt="' + esc(it.upt) + '">Lihat seluruh wilayah layanan</button>' : '') +
      '</div>';
  }
  function uptPopup(u) {
    var s = stats[u.id], color = uptColor(u);
    var body;
    if (s.total) {
      body = '<div class="big"><b>' + s.total + '</b><span>wilayah layanan</span></div>' +
        '<div class="types"><div><b>' + s.offshore + '</b><span>Off Shore</span></div>' +
        '<div><b>' + s.onshore + '</b><span>On Shore</span></div>' +
        '<div><b>' + s.outlook + '</b><span>Outlook</span></div></div>' +
        (s.other ? '<div class="nodata">+ ' + s.other + ' lokasi dengan type lain</div>' : '') +
        '<div class="mini">' +
        STATUS_ORDER.map(function (k) { return '<span><i style="background:' + STATUS[k].color + '"></i>' + STATUS[k].label + ' ' + s[k] + '</span>'; }).join('') + '</div>';
    } else {
      body = '<div class="big"><b>0</b><span>wilayah layanan</span></div><div class="nodata">Belum ada lokasi di data yang ditanggung unit ini.</div>';
    }
    return '<div class="pp" style="--c:' + color + '"><h3>' + esc(u.nama) + '</h3>' +
      '<span class="badge">' + (u.kind === 'pusat' ? 'Kantor Pusat' : 'UPT') + '</span>' + body +
      '<dl><dt>Forecaster</dt><dd>' + (u.forecaster || 0) + ' orang</dd>' +
      '<dt>Koordinat</dt><dd>' + u.lat.toFixed(5) + ', ' + u.lng.toFixed(5) + '</dd></dl>' +
      '<button type="button" class="act" data-act="clear">Tampilkan semua lokasi</button></div>';
  }
  map.on('popupopen', function (e) {
    var el = e.popup.getElement(); if (!el) return;
    var c = el.querySelector('[data-act=clear]'); if (c) c.onclick = function () { clearUpt(false); };
    var l = el.querySelector('[data-upt]'); if (l) l.onclick = function () { selectUpt(l.getAttribute('data-upt'), false); };
  });

  // ---------- rekap Top UPT (ringkas & dinamis) ----------
  var TOP_N = 10;                 // jumlah UPT pada rekap
  var rkMetric = 'layanan';       // 'layanan' | 'forecaster'
  var rkSig = '';
  var PERSON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.400 3.600-7 8-7s8 2.600 8 7z"/></svg>';

  function shortName(n) {
    return String(n).replace(/^Stasiun Meteorologi Maritim\s+/i, 'Stamar ').replace(/^Stasiun Meteorologi\s+/i, 'Stamet ')
                    .replace(/^Direktorat\s+/i, 'Dit. ');
  }
  function filtersActive() { return !!($q.value.trim() || $type.value || !allActive()); }

  // tanpa filter: pakai total dari sheet (termasuk lokasi tanpa koordinat); dengan filter: hitung dari lokasi yang lolos filter
  function computeRekap() {
    var cnt = {}, dyn = filtersActive();
    if (dyn) { filtered(true).forEach(function (it) { if (it.upt) cnt[it.upt] = (cnt[it.upt] || 0) + 1; }); }
    else { UPTS.forEach(function (u) { if (u.layanan) cnt[u.id] = u.layanan; }); }
    var list = Object.keys(cnt).filter(function (id) { return uptById[id]; }).map(function (id) {
      var u = uptById[id]; return { id: id, nama: u.nama, layanan: cnt[id], forecaster: u.forecaster || 0 };
    });
    return { list: list, dyn: dyn };
  }

  function renderRekap(force) {
    if (!UPTS.length) { $rekap.style.display = 'none'; return; }
    $rekap.style.display = 'flex';
    var r = computeRekap(), m = rkMetric, o = m === 'layanan' ? 'forecaster' : 'layanan';
    var list = r.list.slice().sort(function (a, b) { return b[m] - a[m] || b[o] - a[o] || a.nama.localeCompare(b.nama); });
    var top = list.slice(0, TOP_N);
    var totL = 0, totF = 0;
    list.forEach(function (x) { totL += x.layanan; totF += x.forecaster; });

    document.getElementById('rkTitle').textContent = 'Top ' + TOP_N + ' UPT' + (r.dyn ? ' (terfilter)' : '');
    document.getElementById('rkSub').textContent = list.length
      ? totL + ' layanan \u00b7 ' + totF + ' forecaster' : 'Tidak ada layanan yang cocok';

    var sig = rkMetric + '|' + top.map(function (x) { return x.id + ':' + x.layanan + ':' + x.forecaster; }).join(',') + '|' + list.length;
    if (!force && sig === rkSig) { syncRekapSel(); return; }
    rkSig = sig;

    var $l = document.getElementById('rkList');
    if (!top.length) { $l.innerHTML = '<div class="rk-empty">Belum ada data untuk filter ini.</div>'; document.getElementById('rkFoot').textContent = ''; return; }
    var max = Math.max.apply(null, top.map(function (x) { return x[m]; }).concat([1]));
    var color = m === 'layanan' ? '#14a35c' : '#2d6cdf';
    var h = '';
    top.forEach(function (x, i) {
      var sec = m === 'layanan' ? PERSON + x.forecaster : x.layanan + ' lyn';
      h += '<button type="button" class="rk-row' + (i < 3 ? ' top' : '') + '" data-id="' + esc(x.id) + '" style="--c:' + color + '" title="' + esc(x.nama) + '">' +
        '<span class="rk-fill" data-w="' + (x[m] / max * 100).toFixed(1) + '"></span>' +
        '<span class="rk-rank">' + (i + 1) + '</span><span class="rk-nm">' + esc(shortName(x.nama)) + '</span>' +
        '<span class="rk-v">' + x[m] + '</span><span class="rk-s">' + sec + '</span></button>';
    });
    $l.innerHTML = h;

    var sumTop = top.reduce(function (t, x) { return t + x.layanan; }, 0);
    document.getElementById('rkFoot').textContent = 'Top ' + top.length + ' dari ' + list.length + ' UPT \u00b7 ' +
      (totL ? Math.round(sumTop / totL * 100) : 0) + '% dari total layanan';

    Array.prototype.forEach.call($l.querySelectorAll('.rk-row'), function (row) {
      var id = row.getAttribute('data-id');
      row.addEventListener('mouseenter', function () { if (uptMarkers[id]) uptMarkers[id].setIcon(uptIcon(uptById[id], true)); });
      row.addEventListener('mouseleave', function () { if (uptMarkers[id]) uptMarkers[id].setIcon(uptIcon(uptById[id], id === selUpt)); });
      row.addEventListener('click', function () { if (id === selUpt) clearUpt(true); else selectUpt(id, true); });
    });
    // animasi bar: mulai dari 0 lalu tumbuh
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      Array.prototype.forEach.call($l.querySelectorAll('.rk-fill'), function (f) { f.style.width = f.getAttribute('data-w') + '%'; });
    }); });
    syncRekapSel();
  }
  function syncRekapSel() {
    Array.prototype.forEach.call(document.querySelectorAll('#rkList .rk-row'), function (row) {
      row.classList.toggle('sel', row.getAttribute('data-id') === selUpt);
    });
  }
  document.getElementById('rkPill').addEventListener('click', function () {
    var open = $rekap.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  Array.prototype.forEach.call(document.querySelectorAll('#rekap .rk-seg button'), function (b) {
    b.addEventListener('click', function () {
      rkMetric = b.getAttribute('data-m');
      Array.prototype.forEach.call(document.querySelectorAll('#rekap .rk-seg button'), function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
      renderRekap(true);
    });
  });

  // ---------- filter status ----------
  function buildChips() {
    $chips.innerHTML = '';
    STATUS_ORDER.forEach(function (k) {
      var n = ALL.filter(function (x) { return x.status === k; }).length;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.dataset.k = k;
      b.style.setProperty('--c', STATUS[k].color);
      b.innerHTML = '<span class="dot"></span><span>' + STATUS[k].label + '</span><span class="n">' + n + '</span>';
      b.addEventListener('click', function () { toggleStatus(k); });
      $chips.appendChild(b);
    });
    syncChips();
  }
  function syncChips() {
    Array.prototype.forEach.call($chips.children, function (b) { b.setAttribute('aria-pressed', active[b.dataset.k] ? 'true' : 'false'); });
  }
  function toggleStatus(k) {
    if (allActive()) { STATUS_ORDER.forEach(function (s) { active[s] = (s === k); }); }
    else { active[k] = !active[k]; }   // boleh semua mati: hanya pin UPT yang tampil
    syncChips(); render(true);
  }

  // ---------- dropdown ----------
  function buildDropdowns() {
    var types = {};
    ALL.forEach(function (x) { if (x.type) types[x.type] = (types[x.type] || 0) + 1; });
    Object.keys(types).sort().forEach(function (t) {
      var o = document.createElement('option'); o.value = t; o.textContent = t + ' (' + types[t] + ')'; $type.appendChild(o);
    });
    UPTS.filter(function (u) { return stats[u.id].total > 0; })
        .sort(function (a, b) { return a.nama.localeCompare(b.nama); })
        .forEach(function (u) {
          var o = document.createElement('option'); o.value = u.id; o.textContent = u.nama + ' (' + stats[u.id].total + ')'; $upt.appendChild(o);
        });
  }

  // ---------- filter & render ----------
  function filtered(ignoreUpt) {
    var words = $q.value.trim().toLowerCase(); words = words ? words.split(/\s+/) : [];
    var t = $type.value;
    return ALL.filter(function (it) {
      if (it.status !== 'lainnya' && !active[it.status]) return false;
      if (it.status === 'lainnya' && !allActive()) return false;
      if (selUpt && !ignoreUpt && it.upt !== selUpt) return false;
      if (t && it.type !== t) return false;
      if (words.length) { var h = haystack(it); for (var i = 0; i < words.length; i++) if (h.indexOf(words[i]) < 0) return false; }
      return true;
    });
  }

  function syncUptLayer() {
    var show = selUpt ? [selUpt] : (document.getElementById('tgUpt').checked ? UPTS.map(function (u) { return u.id; }) : []);
    UPTS.forEach(function (u) {
      var m = uptMarkers[u.id], want = show.indexOf(u.id) >= 0, has = uptLayer.hasLayer(m);
      if (want && !has) uptLayer.addLayer(m);
      if (!want && has) uptLayer.removeLayer(m);
    });
  }

  function render(fit) {
    syncUptLayer();
    renderRekap();
    var rows = filtered();
    locLayer.clearLayers(); lineLayer.clearLayers();
    rows.forEach(function (it) { locLayer.addLayer(markers[it.id]); });

    if (selUpt && uptById[selUpt]) {
      var u = uptById[selUpt];
      rows.forEach(function (it) {
        L.polyline([[u.lat, u.lng], [it.lat, it.lng]], { color: u.kind === 'pusat' ? PUSAT_COLOR : UPT_COLOR, weight: 1.4, opacity: 0.5, dashArray: '5 6', interactive: false }).addTo(lineLayer);
      });
    }

    $list.innerHTML = '';
    var frag = document.createDocumentFragment();
    rows.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'item'; b.setAttribute('role', 'listitem');
      b.style.setProperty('--c', (STATUS[it.status] || STATUS.lainnya).color);
      b.innerHTML = '<b>' + esc(it.lokasi) + '</b><span>' + esc(it.type || '-') + ' - ' + esc(it.pj || '-') + '</span>';
      b.addEventListener('click', function () { focusItem(it); });
      frag.appendChild(b);
    });
    $list.appendChild(frag);
    var noStatus = !STATUS_ORDER.some(function (k) { return active[k]; });
    $empty.textContent = noStatus
      ? 'Semua status dimatikan, jadi hanya pin UPT yang tampil. Aktifkan salah satu status untuk menampilkan lokasi.'
      : 'Tidak ada lokasi yang cocok. Coba kata kunci lain atau aktifkan status lain.';
    $empty.style.display = rows.length ? 'none' : 'block';
    $count.textContent = noStatus ? 'Status kosong: hanya pin UPT' : 'Menampilkan ' + rows.length + ' dari ' + ALL.length + ' lokasi';

    if (fit) fitView(rows);
  }

  function fitView(rows) {
    var pts = rows.map(function (r) { return [r.lat, r.lng]; });
    if (selUpt && uptById[selUpt]) pts.push([uptById[selUpt].lat, uptById[selUpt].lng]);
    if (pts.length === 0) map.fitBounds(INDONESIA);
    else if (pts.length === 1) map.setView(pts[0], 9);
    else map.fitBounds(L.latLngBounds(pts).pad(0.18), { maxZoom: 9 });
  }

  function focusItem(it) {
    map.setView([it.lat, it.lng], Math.max(map.getZoom(), 9));
    markers[it.id].openPopup();
  }

  // ---------- pilih UPT ----------
  function refreshUptIcons() {
    UPTS.forEach(function (u) { uptMarkers[u.id].setIcon(uptIcon(u, u.id === selUpt)); });
  }
  function selectUpt(id, fit) {
    if (!uptById[id]) return;
    selUpt = id;
    $upt.value = (Array.prototype.some.call($upt.options, function (o) { return o.value === id; })) ? id : '';
    refreshUptIcons();
    map.closePopup();
    render(false);
    if (fit) fitView(filtered());
    uptMarkers[id].openPopup();
  }
  function clearUpt(fit) {
    selUpt = ''; $upt.value = '';
    refreshUptIcons(); map.closePopup(); render(!!fit);
  }

  // ---------- events ----------
  var timer;
  $q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { render(true); }, 180); });
  $type.addEventListener('change', function () { render(true); });
  $upt.addEventListener('change', function () { if ($upt.value) selectUpt($upt.value, true); else clearUpt(true); });
  document.getElementById('tgUpt').addEventListener('change', function (e) {
    syncUptLayer();
  });
  document.getElementById('reset').addEventListener('click', function () {
    $q.value = ''; $type.value = ''; $upt.value = ''; selUpt = '';
    STATUS_ORDER.forEach(function (s) { active[s] = true; });
    syncChips(); refreshUptIcons(); map.closePopup(); render(true);
  });
  window.addEventListener('resize', function () { map.invalidateSize(); });

  // ---------- muat data ----------
  function init(res) {
    ALL = res.rows || []; UPTS = res.upts || [];
    UPTS.forEach(function (u) {
      uptById[u.id] = u;
      stats[u.id] = { total: 0, ongoing: 0, request: 0, suspended: 0, lainnya: 0, offshore: 0, onshore: 0, outlook: 0, other: 0 };
    });
    ALL.forEach(function (it) {
      if (it.upt && stats[it.upt]) { var st = stats[it.upt]; st.total++; st[it.status]++; st[glyphKey(it.type)]++; }
      var m = L.marker([it.lat, it.lng], { icon: locIcon(it), title: it.lokasi, riseOnHover: true, zIndexOffset: Z[it.status] || 0 });
      m.bindPopup(locPopup(it), { maxWidth: 310 });
      markers[it.id] = m;
    });
    UPTS.forEach(function (u) {
      var m = L.marker([u.lat, u.lng], { icon: uptIcon(u, false), title: u.nama, riseOnHover: true, zIndexOffset: 400 });
      m.bindPopup(uptPopup(u), { maxWidth: 310 });
      m.on('click', function () { selectUpt(u.id, false); });
      uptMarkers[u.id] = m;
    });
    buildChips(); buildDropdowns(); render(false);
    renderRekap(true);

    var notes = [];
    if (res.skipped && res.skipped.length) notes.push(res.skipped.length + ' lokasi belum tampil karena koordinat kosong/tidak valid: ' +
      res.skipped.map(function (x) { return x.lokasi + (x.koordinat ? ' ("' + x.koordinat + '")' : ''); }).join('; '));
    if (res.uptSkipped && res.uptSkipped.length) notes.push('UPT tanpa koordinat valid di sheet UPT: ' + res.uptSkipped.join('; '));
    if (res.unmatched && res.unmatched.length) notes.push('Penanggung jawab yang belum cocok dengan sheet UPT: ' + res.unmatched.join('; '));
    if (!UPTS.length) notes.push('Sheet UPT tidak ditemukan atau kosong, pin UPT tidak ditampilkan.');
    if (notes.length) {
      var s = document.getElementById('skipped'); s.style.display = 'block';
      s.innerHTML = notes.map(function (n) { return '<p>' + esc(n) + '</p>'; }).join('');
    }
    document.getElementById('loading').style.display = 'none';
    setTimeout(function () { map.invalidateSize(); map.fitBounds(INDONESIA); }, 100);
  }
  function fail(e) {
    var l = document.getElementById('loading'); l.className = 'err';
    l.textContent = 'Gagal memuat data: ' + (e && e.message ? e.message : e);
  }
  google.script.run.withSuccessHandler(init).withFailureHandler(fail).getData();
})();
</script>
</body>
</html>
